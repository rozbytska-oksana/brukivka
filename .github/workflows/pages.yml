name: Verify and deploy GitHub Pages demo

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified demo to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      BRUKIVKA_TARGET: demo
      BRUKIVKA_ALLOW_INDEXING: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Check code and formatting
        run: npm run lint

      - name: Test source and original assets
        run: npm test

      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate and verify static demo
        env:
          NUXT_APP_BASE_URL: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          BRUKIVKA_SITE_URL: ${{ format('{0}/', steps.pages.outputs.base_url) }}
        run: |
          npm run generate
          npm run verify:output
          npm run verify:http

      - name: Upload static site only
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    name: Publish demo
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
